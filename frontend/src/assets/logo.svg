<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7B61FF" />
      <stop offset="100%" stop-color="#00FFB2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" stroke="url(#cyberGrad)" stroke-width="4" fill="none" filter="url(#glow)"/>
  <polygon points="50,22 75,36 75,64 50,78 25,64 25,36" stroke="#00E5FF" stroke-width="2" fill="rgba(15, 23, 42, 0.7)"/>
  <circle cx="50" cy="50" r="8" fill="#00FFB2" filter="url(#glow)"/>
  <circle cx="35" cy="38" r="4" fill="#00E5FF"/>
  <circle cx="65" cy="38" r="4" fill="#7B61FF"/>
  <circle cx="35" cy="62" r="4" fill="#7B61FF"/>
  <circle cx="65" cy="62" r="4" fill="#00E5FF"/>
  <line x1="50" y1="50" x2="35" y2="38" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="50" y1="50" x2="65" y2="38" stroke="#7B61FF" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="50" y1="50" x2="35" y2="62" stroke="#7B61FF" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="50" y1="50" x2="65" y2="62" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="2 2"/>
</svg>
